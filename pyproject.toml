[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reglens"
version = "0.1.0"
description = "RegLens: cited regulatory intelligence with auditable RAG workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.45.0",
]
openai = [
  "openai>=2.0.0",
]
pdf = [
  "pypdf>=4.0.0",
]
qdrant = [
  "qdrant-client>=1.12,<1.14",
]
rerank = [
  "sentence-transformers>=3.0.0",
]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that exercise more than one component",
  "live_openai: tests that require live OpenAI credentials",
  "requires_browser: tests that require browser automation tooling",
  "requires_qdrant: tests that require Qdrant",
  "requires_model_download: tests that download or load ML model weights",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
disallow_untyped_decorators = false
